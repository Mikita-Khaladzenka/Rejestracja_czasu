<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<title>Panel administratora</title>

<link rel="stylesheet" href="adm.css">

</head>


<body>


<div class="admin-container">


<header>

<h1>
Panel administratora
</h1>

<p>
Zarządzanie pracownikami
</p>

</header>



<section id="login" class="login-page">

    <div class="login-box">

        <h2>Panel administratora</h2>

        <p>Podaj hasło administratora</p>

        <input
            id="haslo"
            type="password"
            placeholder="Hasło">

        <button onclick="login()">
            Zaloguj
        </button>

    </div>

</section>






<section id="panel" style="display:none">


<div class="box">


<h2>
Dodaj pracownika
</h2>


<div class="formularz">


<input id="id"
placeholder="ID">


<input id="imie"
placeholder="Imię">


<input id="process"
placeholder="Process">


<button onclick="dodaj()">
Dodaj
</button>


</div>


</div>




<div class="box">


<h2>
Lista pracowników
</h2>


<table>


<thead>

<tr>

<th>ID</th>

<th>Imię</th>

<th>Process</th>

<th>Akcja</th>


</tr>


</thead>


<tbody id="lista">


</tbody>


</table>


</div>



</section>


</div>


<script src="adm.js"></script>


</body>

</html>
